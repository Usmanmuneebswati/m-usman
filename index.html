<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>USMAN | Personal Website</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">
        <div class="logo">USMAN</div>
        <p>My Personal World</p>
    </header>

    <section class="profile">
        <h1>Welcome to My Website</h1>
        <p> My Life.</p>
    </section>

    <section class="upload-section" id="adminSection">

        <h2>Upload New Video or Photo</h2>

        <input
            type="password"
            id="adminPassword"
            placeholder="Enter admin password"
        >

        <input
            type="text"
            id="title"
            placeholder="Enter title"
        >

        <textarea
            id="description"
            placeholder="Write video description..."
        ></textarea>

        <input
            type="file"
            id="mediaFile"
            accept="image/*,video/*"
        >

        <button id="uploadBtn">Upload Media</button>

        <p id="message"></p>

    </section>

    <main>
        <h2 class="section-title">My Latest Posts</h2>

        <div id="posts" class="posts"></div>
    </main>

    <footer>
        <p>© 2026 USMAN | All Rights Reserved</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
